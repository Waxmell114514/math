# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# Catalog of papers with a formalized main result. Paths are relative to lean/.
version: "v0.4"

project:
  name: "OpenAI math repository"
  description: "Lean formalizations accompanying a mathematics manuscript collection."
  authors: ["OpenAI"]
  license: "Apache-2.0"

sources:
  - title: "The Exponential Time Hypothesis is False"
    authors: ["OpenAI"]
    id: ../preprints/The-Exponential-Time-Hypothesis-is-False-October-25-2026/paper.pdf
    type: article

related_formalizations:
  - id: https://github.com/leanprover-community/mathlib4
    relationship: builds-on

status:
  scope: "Main result formalized."
  main_results:
    - comparator_config: ComparatorChallenges/SubexponentialSAT.json
      declaration: OAI.Algorithms.SubexponentialSAT.SqrtLogSpace.exact_count_and_sat
      file: OAI/Algorithms/SubexponentialSAT/SqrtLogSpace/Final.lean

automation:
  methods:
    - method: agent

review:
  status: unchecked

acknowledgements: >-
  Thank you very much to the authors of Lean 4, mathlib, and the other imported
  libraries listed above, as well as to the authors of Lake, Comparator,
  lean4export, and related tools.
